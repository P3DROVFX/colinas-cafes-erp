services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: colinas
      POSTGRES_PASSWORD: colinas
      POSTGRES_DB: colinas_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro,z

volumes:
  postgres-data:
